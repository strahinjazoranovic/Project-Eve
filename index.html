<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Project Eve</title>
    <link
      rel="icon"
      href="assets/player/spaceshuttle.png"
      type="image/icon type"
    />
    <link rel="stylesheet" href="css/game.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="notLaptop">
      <h1 id="titlemenu">PROJECT EVE</h1>
      <span
        >Was not developed to work on phones or tablets<br />It is only playable
        on an laptop or desktop.</span
      >
    </div>
    <div class="laptop">
      <div id="start">
        <h1 class="startHeader">PROJECT EVE</h1>
        <img src="assets/game.png" id="foto" />
        <a href="game.html"><button class="knop1">PLAY GAME</button></a>
        <h1 class="highScore">Highscore:<span class="highScoreEl">0</span></h1>
      </div>
    </div>
  </body>
  <script>
    const highScoreEl = document.querySelector(".highScoreEl");
    let score = localStorage.getItem("highScore") || 0;
    highScoreEl.textContent = score;
  </script>
</html>
